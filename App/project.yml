# XcodeGen-Projekt fuer die iPhone-App »VYRA KI« (wird im GitHub-Build mit `xcodegen generate` erzeugt).
name: VYRAKI
options:
  bundleIdPrefix: de.vyra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VYRAKit:
    path: ../VYRAKit
targets:
  VYRAKI:
    type: application
    platform: iOS
    sources:
      - path: VYRAKI
    dependencies:
      - package: VYRAKit
        product: VYRAKit
    info:
      path: VYRAKI/Info.plist
      properties:
        CFBundleDisplayName: VYRA KI
        CFBundleShortVersionString: "4.15.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Im Sprachmodus hört VYRA KI zu, damit du Fragen sprechen kannst."
        NSSpeechRecognitionUsageDescription: "Deine gesprochene Frage wird in Text umgewandelt – wenn möglich direkt auf dem iPhone."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: VYRAKI/VYRAKI.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.vyra.ki
        PRODUCT_NAME: VYRAKI
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "4.15.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  VYRAKI:
    build:
      targets:
        VYRAKI: all
